<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F7A58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ESC26">
<meta name="description" content="Match times, courts and venues for the 2026 European Senior Badminton Championships in Cagliari: your matches, your friends, your country, and how far behind schedule each venue is running.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F7A58'/%3E%3Ccircle cx='32' cy='22' r='9' fill='%23fff'/%3E%3Cpath d='M20 54 L32 30 L44 54 Z' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F7A58'/%3E%3Ccircle cx='32' cy='22' r='9' fill='%23fff'/%3E%3Cpath d='M20 54 L32 30 L44 54 Z' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<title>ESC26 Cagliari</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface2:#E9EDE8; --ink:#16212A; --ink2:#5E6B74; --ink3:#8B979F;
  --line:#D8DED9; --accent:#1F7A58; --accent-soft:#DDEFE6; --accent-ink:#0F4D36;
  --live:#D6453A; --live-soft:#FBE4E1; --warn:#B9730B; --warn-soft:#FBEBD0;
  --vA:#2B62D9; --vA-soft:#DDE7FB; --vB:#D9781F; --vB-soft:#FBE8D6; --vC:#7E4FD6; --vC-soft:#EAE1FB;
  --hl:#FFF3C4; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1418; --surface:#161E24; --surface2:#1E2930; --ink:#E7ECEA; --ink2:#A2AEB5; --ink3:#73808A;
    --line:#2A363E; --accent:#43B282; --accent-soft:#183A2C; --accent-ink:#B8EBD1;
    --live:#FF6F63; --live-soft:#45211E; --warn:#F0A83A; --warn-soft:#3E2E12;
    --vA:#7FA6FF; --vA-soft:#1D2C4D; --vB:#F3A45B; --vB-soft:#43301A; --vC:#B79BFF; --vC-soft:#31264D;
    --hl:#4A3E14; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#161E24; --surface2:#1E2930; --ink:#E7ECEA; --ink2:#A2AEB5; --ink3:#73808A;
  --line:#2A363E; --accent:#43B282; --accent-soft:#183A2C; --accent-ink:#B8EBD1;
  --live:#FF6F63; --live-soft:#45211E; --warn:#F0A83A; --warn-soft:#3E2E12;
  --vA:#7FA6FF; --vA-soft:#1D2C4D; --vB:#F3A45B; --vB-soft:#43301A; --vC:#B79BFF; --vC-soft:#31264D;
  --hl:#4A3E14; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cond{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:760px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{margin:0;font:700 21px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.2px;text-transform:uppercase;white-space:nowrap}
.brand small{color:var(--ink2);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.dot.ok{background:var(--accent)} .dot.err{background:var(--live)} .dot.busy{background:var(--warn);animation:pulse 1s infinite}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.iconbtn.spin svg,.dot.busy,.livedot{animation:none}}

/* main */
main{max-width:760px;margin:0 auto;padding:12px 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;background:var(--warn-soft);color:var(--ink);border:1px solid transparent}
.banner.err{background:var(--live-soft)}
.banner.info{background:var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
h2{font:700 20px/1.1 "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.3px;margin:18px 0 8px}
h2:first-child{margin-top:4px}
h3{font:600 15px/1.2 "Barlow",system-ui,sans-serif;margin:0 0 6px}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}

/* search */
.search{position:relative}
.sres{margin-top:10px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 40px 12px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search input::placeholder{color:var(--ink3)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:32px;height:32px;border-radius:8px;color:var(--ink2);font-size:18px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.list > *{border-top:1px solid var(--line)} .list > :first-child{border-top:0}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.prow:active{background:var(--surface2)}
.prow .nm{font-weight:600}
.prow .sub{font-size:12px;color:var(--ink2)}
.flag{font-size:18px;line-height:1;width:24px;text-align:center;flex:0 0 auto}
.cc{font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--ink2);background:var(--surface2);border-radius:4px;padding:2px 3px;line-height:1}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-weight:500;opacity:.7;font-size:12px}
.cgrid{display:flex;flex-wrap:wrap;gap:8px}
.cgrid .chip{padding:8px 12px 8px 9px}
.chip.day{flex-direction:column;gap:0;padding:6px 12px;line-height:1.05;min-width:56px}
.chip.day b{font:700 16px/1 "Barlow Condensed",system-ui,sans-serif}
.chip.day span{font-size:11px;font-weight:500;opacity:.75}
.chip.day.nodata{opacity:.45}

/* match cards */
.dayhead{display:flex;align-items:baseline;gap:8px;margin:16px 0 6px}
.dayhead h2{margin:0}
.dayhead .muted{font-size:13px}
.match{display:grid;grid-template-columns:minmax(66px,auto) 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);position:relative}
.match.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.match.past{opacity:.72}
.match.bye{opacity:.6}
.when{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.when .t{font:700 24px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.2px}
.when .est{font-size:12px;color:var(--warn);font-weight:600;line-height:1.1}
.when .est.ok{color:var(--ink3);font-weight:500}
.vchip{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:3px 6px;font:700 12px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.3px;text-transform:uppercase}
.vchip .lt{font-size:14px}
.v-A{background:var(--vA-soft);color:var(--vA)} .v-B{background:var(--vB-soft);color:var(--vB)} .v-C{background:var(--vC-soft);color:var(--vC)} .v-{background:var(--surface2);color:var(--ink2)}
.court{font-size:12px;color:var(--ink2);font-weight:600}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ev{font:600 13px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2)}
.pill{margin-left:auto;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill.live{background:var(--live-soft);color:var(--live)}
.pill.warm{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--surface2);color:var(--ink2)}
.pill.bye{background:var(--surface2);color:var(--ink2)}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}
.team{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;padding:3px 0}
.team .names{min-width:0;font-weight:500;line-height:1.25}
.team .names .p{display:inline}
.team .names .sep{color:var(--ink3);margin:0 3px}
.team.win .names{font-weight:700}
.team.lose .names{color:var(--ink2)}
.team .names .me{background:var(--hl);border-radius:4px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.team .pflag{font-size:14px;margin-right:1px}
.team .seed{font-size:11px;color:var(--ink3);font-weight:600;margin-left:3px}
.sets{display:flex;gap:6px;font:600 15px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--ink2);min-width:0}
.sets span{width:20px;text-align:right;font-variant-numeric:tabular-nums}
.team.win .sets span{color:var(--ink)}
.sets span.cur{color:var(--live);font-weight:700}
.vs{position:absolute;left:78px;font-size:10px;color:var(--ink3);letter-spacing:.5px}
.mfoot{display:flex;gap:10px;margin-top:4px;font-size:12px;color:var(--ink2)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--live);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin:6px 0}
.nowline::before,.nowline::after{content:"";flex:1;height:1px;background:var(--live);opacity:.5}

/* hero for me */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#2a9a6f 100%);color:#fff;border-radius:16px;padding:18px 16px}
.hero h2{color:#fff;margin:0 0 4px;font-size:24px}
.hero p{margin:0 0 12px;opacity:.92}
.hero .search input{border-color:transparent}
.mehead{display:flex;align-items:center;gap:12px}
.mehead .big{font:700 26px/1 "Barlow Condensed",system-ui,sans-serif}
.mehead .flag{font-size:30px;width:36px}
.next{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:10px 12px;font-size:14px}
.next b{font-weight:700}

/* road ahead + draw */
.road .rhead{margin-bottom:6px}
.road-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.road-steps li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:start}
.road-steps li:first-child{border-top:0}
.road-steps li.now .rd{color:var(--accent)}
.road-steps .rd{font:700 14px/1.3 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2);padding-top:1px}
.road-steps .who{font-size:14px;line-height:1.35}
.road-steps .who .sep{color:var(--ink3)}
.road-steps .seed{font-size:11px;color:var(--ink3);font-weight:600}
.match.tbd{border-style:dashed;box-shadow:none;opacity:.85}
.match.tbd .me{background:var(--hl);border-radius:4px;padding:0 3px}
.match.tbd .seed{font-size:11px;color:var(--ink3);font-weight:600}
.pill.sched{background:var(--surface2);color:var(--ink2)}
.byes summary{cursor:pointer;padding:4px 2px}
.chip.rd{padding:7px 11px}
/* venues */
.vcard{border-left:5px solid var(--line)}
.vcard.v-A{border-left-color:var(--vA);background:var(--surface);color:var(--ink)}
.vcard.v-B{border-left-color:var(--vB);background:var(--surface);color:var(--ink)}
.vcard.v-C{border-left-color:var(--vC);background:var(--surface);color:var(--ink)}
.vtitle{display:flex;align-items:baseline;gap:8px}
.vtitle .lt{font:700 28px/1 "Barlow Condensed",system-ui,sans-serif}
.vtitle .nm{font-weight:600}
.delay{margin:8px 0 10px;font:600 15px/1.2 "Barlow",system-ui,sans-serif}
.delay .big{font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;margin-right:4px}
.delay.ok .big{color:var(--accent)} .delay.late .big{color:var(--warn)} .delay.bad .big{color:var(--live)}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ct{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;min-height:64px;background:var(--bg)}
.ct .cn{font:700 13px/1 "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);display:flex;justify-content:space-between;margin-bottom:5px}
.ct .cn .st{color:var(--live)} .ct .cn .st.warm{color:var(--warn)} .ct .cn .st.free{color:var(--ink3)}
.ct .who{font-weight:600;line-height:1.2;font-size:13px}
.ct .who.dim{font-weight:500;color:var(--ink2)}
.ct .sc{font:600 13px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--ink2);margin-top:4px}

/* venue: court pills and on-court list */
.courtrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px}
.cpill{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 6px;border-radius:7px;font:700 13px/1 "Barlow Condensed",system-ui,sans-serif;background:var(--surface2);color:var(--ink3);border:1px dashed var(--line)}
.cpill.live{background:var(--live-soft);color:var(--live);border-style:solid;border-color:transparent}
.cpill.warm{background:var(--warn-soft);color:var(--warn);border-style:solid;border-color:transparent}
.cpill.fin{background:var(--surface2);color:var(--ink2);border-style:solid;border-color:transparent}
.onlist{display:flex;flex-direction:column}
.onrow{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.onrow:first-child{border-top:0}
.cbadge{display:inline-flex;align-items:center;justify-content:center;height:28px;border-radius:7px;background:var(--live-soft);color:var(--live);font:700 13px/1 "Barlow Condensed",system-ui,sans-serif}
.cbadge.q{background:var(--surface2);color:var(--ink3);border:1px dashed var(--line)}
.onrow .sc{font:600 14px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--ink2);margin-left:6px;white-space:nowrap}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.empty{padding:24px 12px;text-align:center;color:var(--ink2)}
.foot{margin-top:28px;font-size:12px;color:var(--ink3);line-height:1.5}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:40;box-shadow:var(--shadow)}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1>ESC26 Cagliari</h1><small id="sub">European Senior Championships · 19–27 Sep</small></div>
  <div class="upd"><span class="dot" id="dot"></span><span id="updtxt">…</span></div>
  <button class="iconbtn" id="refresh" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</div></header>

<main id="view"><div class="stack"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>

<nav class="tabbar"><div class="tabbar-in">
  <button class="tab" data-tab="me" id="tab-me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</button>
  <button class="tab" data-tab="players" id="tab-players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Players</button>
  <button class="tab" data-tab="countries" id="tab-countries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/></svg>Countries</button>
  <button class="tab" data-tab="venues" id="tab-venues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg>Venues</button>
</div></nav>

<script>
(function(){
'use strict';
/* ---------- configuration ---------- */
const CFG = {
  code: 'CC7C6F6B-949E-4A29-B7FF-54D537610F5B',
  api: 'https://extranet-lv.bwfbadminton.com/api/tournaments/day-matches',
  days: ['2026-09-19','2026-09-20','2026-09-21','2026-09-22','2026-09-23','2026-09-24','2026-09-25','2026-09-26','2026-09-27'],
  tz: 'Europe/Rome',

function keyMin(s){ // 'YYYY-MM-DD HH:MM' -> minutes

/* ---------- normalisation for search ---------- */
const XLAT = {'ø':'o','æ':'ae','å':'a','ß':'ss','ð':'d','þ':'th','ł':'l','đ':'d','œ':'oe','ı':'i'};
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[øæåßðþłđœı]/g,c=>XLAT[c]||c).replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// The BWF feed capitalises the letter after a non-ASCII letter ("SøRen", "MåNs"). Fix that in words that are not all caps.
function fixName(s){ return (s||'').split(' ').map(w=>{ if(w===w.toUpperCase()) return w; return w.replace(/([^\x00-\x7F])([A-Z])/g,(m,a,b)=>a+b.toLowerCase()); }).join(' '); }

function compact(raw, date){
  const out=[];
  for(const m of raw){
    const team=t=>(t&&t.players||[]).map(p=>({i:String(p.id), n:fixName(p.nameDisplay||((p.firstName||'')+' '+(p.lastName||'')).trim()), c:p.countryCode||t.countryCode||''}));
    const a=team(m.team1), b=team(m.team2);
    let v=''; const lm=/Venue\s+([A-Z])/i.exec(m.locationName||''); if(lm) v=lm[1].toUpperCase();
    const cn=/(\d+)/.exec(m.courtName||''); const court=cn?+cn[1]:0;
    if(!v && court){ for(const k in CFG.venues){ if(CFG.venues[k].courts.includes(court)) v=k; } }
    out.push({
      i:String(m.id), n:String(m.code||''), d:date, t:(m.matchTime||'').slice(0,16), tm:(m.matchTime||'').slice(11,16),
      ev:m.eventName||m.drawName||'', rd:m.roundName||'', court, v, loc:m.locationName||'',
      st:m.matchStatus||'N', stv:m.matchStatusValue||'', ss:m.scoreStatusValue||'Normal', du:m.duration==null?null:+m.duration,
      w:+m.winner||0, sc:(m.score||[]).map(s=>[s.home,s.away]), a, b, sa:m.team1seed||'', sb:m.team2seed||'',
      bye:(!a.length||!b.length)
    });
  }
  out.sort((x,y)=> x.t<y.t?-1:x.t>y.t?1:(x.court||99)-(y.court||99));
  return out;
}
async function fetchDay(date){
  const url=CFG.api+'?tournamentCode='+CFG.code+'&date='+date+'&order=2&court=0';
  const r=await fetch(url,{cache:'default'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  const arr=Array.isArray(j)?j:(j.results||j.matches||[]);
  return compact(arr,date);
}
function rebuildIndex(){
  D.players=new Map(); D.countries=new Map(); D.byCode=new Map();
  for(const date of CFG.days){
    const day=D.days[date]; if(!day) continue;
    for(const m of day.m){
      if(m.n) D.byCode.set(m.n,m);
      for(const p of m.a.concat(m.b)){
        let e=D.players.get(p.i);
        if(!e){ e={i:p.i,n:p.n,c:p.c,ev:new Set(),k:norm(p.n)}; D.players.set(p.i,e); }
        e.ev.add(m.ev);
        if(p.c){ D.countries.set(p.c,(D.countries.get(p.c)||0)+1); }
      }
    }
  }
}
function today(){ return romeNow().slice(0,10); }
function needsFetch(date, force){
  const day=D.days[date]; if(!day) return true; if(force) return true;
  const age=Date.now()-day.at; const td=today();
  if(date===td) return age>30000;
  if(date<td) return age>CFG.pastMs || !day.m.length;
  return age>CFG.futureMs || !day.m.length;
}
async function load(opts){

}

/* delay estimate per venue, from today's matches */
function venueDelays(){
  const td=today(), nowM=keyMin(romeNow()); const day=D.days[td]; const res={};
  for(const v in CFG.venues){
    const ms=day?day.m.filter(m=>m.v===v&&!m.bye):[];
    const on=ms.filter(m=>m.st==='P'||m.st==='W');
    const ds=on.map(m=>(nowM-(m.du||0))-keyMin(m.t)).sort((a,b)=>a-b);
    let est=null, kind='none', basis=0;
    if(ds.length){ est=ds[Math.floor(ds.length/2)]; kind='live'; basis=ds.length; }
    const overdue=ms.filter(m=>m.st==='N'&&keyMin(m.t)<nowM);
    if(overdue.length){
      const bound=nowM-Math.max(...overdue.map(m=>keyMin(m.t))); // conservative lower bound
      if(est==null){ est=bound; kind='bound'; basis=overdue.length; }
      else if(bound>est){ est=bound; kind='bound+'; }
    }
    const fin=ms.filter(m=>m.st==='F'||m.st==='O').length, tot=ms.length;
    const lastSched=ms.length?Math.max(...ms.map(m=>keyMin(m.t))):null;
    const started=ms.length&&ms.every(m=>m.st!=='N');
    res[v]={est:est==null?null:Math.round(est), kind, basis, fin, tot, on:on.length, done:started&&tot>0&&fin===tot, lastSched};
  }
  return res;
}
function delayText(d){
  if(!d||d.est==null){ if(d&&d.done) return {cls:'ok',big:'Done',txt:'All matches in this venue are finished for today.'}; return {cls:'ok',big:'—',txt:'No live matches right now.'}; }
  const e=d.est;
  const basis=d.kind==='live'||d.kind==='bound+'?d.basis+' match'+(d.basis===1?'':'es')+' on court':'no match has started since its scheduled time';
  if(e<=5&&e>=-10) return {cls:'ok',big:'On time',txt:'Running to schedule (based on '+basis+').'};
  if(e<-10) return {cls:'ok',big:Math.abs(e)+' min',txt:'ahead of schedule (based on '+basis+').'};
  const cls=e>=45?'bad':'late';
  const pre=d.kind==='bound'?'at least ':'about ';
  return {cls,big:pre+e+' min',txt:'behind schedule (based on '+basis+').'};
}

function searchResults(q, opt){

    if(ok){ hits.push(p); }
  }
  hits.sort((a,b)=>{ const ea=a.k===nq?0:1, eb=b.k===nq?0:1; if(ea!==eb) return ea-eb; return a.n.split(' ').pop().localeCompare(b.n.split(' ').pop())||a.n.localeCompare(b.n); });
  if(!hits.length) return '<div class="empty">No player found for “'+esc(q)+'”. Try the surname only, as written in the draw. Players whose first match is not scheduled yet cannot be found.</div>';
  return '<div class="list">'+hits.slice(0,25).map(p=>'<button class="prow" data-act="'+(opt.act||'open')+'" data-id="'+p.i+'"><span class="flag">'+flag(p.c)+'</span><div class="grow"><div class="nm">'+esc(p.n)+'</div><div class="sub">'+esc(cname(p.c))+' · '+[...p.ev].join(', ')+'</div></div>'+(isFollowed(p.i)?'<span class="tiny muted">★</span>':'')+'</button>').join('')+(hits.length>25?'<div class="empty small">'+(hits.length-25)+' more, keep typing…</div>':'')+'</div>';
}

/* ---------- draws (brackets) ---------- */
const DRAW_API='https://extranet-lv.bwfbadminton.com/api/';
async function loadDrawList(){
  if(D.drawList) return D.drawList;
  const c=store.get('drawlist'); if(c&&c.at&&Date.now()-c.at<6*3600000&&c.list){ D.drawList=c.list; return c.list; }
  const r=await fetch(DRAW_API+'vue-tournament-draws?tmtTab=draw&tmtId=5871',{cache:'default'}); if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); const list=(j.results||[]).map(d=>({id:String(d.value),name:d.text,size:d.size,slug:d.slug}));
  D.drawList=list; store.set('drawlist',{at:Date.now(),list}); return list;
}
function drawFor(eventName){ return (D.drawList||[]).find(d=>d.name===eventName)||null; }
function compactDraw(res){
  const team=t=>(t&&t.players||[]).map(p=>({i:String(p.id), n:fixName(p.nameDisplay||''), c:p.countryCode||t.countryCode||''}));
  const isBye=t=>!!(t&&(t.linkName==='Bye'||t.teamName==='Bye'));
  const out=[]; const rounds={};
  const R=res&&res.results||{};
  for(const k in R){
    const m=R[k]&&R[k].match; if(!m) continue;
    const [c,r]=k.split('-').map(Number); if(isNaN(c)||isNaN(r)) continue;
    rounds[c]=m.roundName||rounds[c]||'';
    out.push({c,r,n:String(m.code||''),rd:m.roundName||'',t:(m.matchTime||'').slice(0,16),st:m.matchStatus||'N',w:+m.winner||0,a:team(m.team1),b:team(m.team2),ab:isBye(m.team1),bb:isBye(m.team2),sa:m.team1seed||'',sb:m.team2seed||'',sc:(m.score||[]).map(x=>[x.home,x.away]),ss:m.scoreStatusValue||'Normal'});
  }
  out.sort((x,y)=>x.c-y.c||x.r-y.r);
  const cols=out.length?Math.max(...out.map(m=>m.c))+1:0;
  return {m:out, cols, rounds};
}
async function loadDraw(id, force){
  const cur=D.draws[id];
  if(cur&&!force&&Date.now()-cur.at<10*60000) return cur;
  if(!cur){ const c=store.get('draw:'+id); if(c&&c.m){ D.draws[id]=c; if(!force&&Date.now()-c.at<10*60000) return c; } }
  if(D.drawBusy[id]) return D.drawBusy[id];
  D.drawBusy[id]=(async()=>{
    try{
      const r=await fetch(DRAW_API+'vue-tournament-draw-data?tmtTab=draw&tmtId=5871&drawId='+id,{cache:'default'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json(); const d=compactDraw(j); d.at=Date.now(); d.id=id;
      D.draws[id]=d; store.set('draw:'+id,d); return d;
    } finally { delete D.drawBusy[id]; }
  })();
  return D.drawBusy[id];
}
function drawMatch(d,c,r){ return d.m.find(m=>m.c===c&&m.r===r); }
function teamKnown(m,side){ const t=side?m.b:m.a; return t.length>0||(side?m.bb:m.ab); }
function teamIsBye(m,side){ return side?m.bb:m.ab; }
// teams still able to reach match (c,r), following unfinished branches down to the first round
function aliveTeams(d,c,r){
  const m=drawMatch(d,c,r); if(!m) return [];
  if(m.w===1||m.w===2){ const t=m.w===1?m.a:m.b; return t.length?[{p:t,seed:m.w===1?m.sa:m.sb}]:[]; }
  let out=[];
  for(const side of [0,1]){
    if(teamKnown(m,side)){ if(!teamIsBye(m,side)){ const t=side?m.b:m.a; out.push({p:t,seed:side?m.sb:m.sa}); } }
    else if(c>0){ out=out.concat(aliveTeams(d,c-1,2*r+side)); }
  }
  return out;
}
function playerInTeam(t,pid){ return t.some(p=>p.i===pid); }
// where a player stands in a draw: the highest-round match that contains them
function playerPosition(d,pid){
  let best=null;
  for(const m of d.m){ if(playerInTeam(m.a,pid)||playerInTeam(m.b,pid)){ if(!best||m.c>best.c) best=m; } }
  if(!best) return null;
  const side=playerInTeam(best.b,pid)?1:0;
  const won=best.w===side+1, lost=(best.w===1||best.w===2)&&!won;
  return {m:best, side, won, lost};
}
// the road ahead: for every later round, the teams that can still be the opponent
function roadAhead(d,pid){
  const pos=playerPosition(d,pid); if(!pos) return null;
  let c=pos.m.c, r=pos.m.r;
  const steps=[];
  if(pos.lost) return {pos, steps, out:true};
  // current match (if it is still to be played and the opponent side is known/unknown)
  if(!pos.won){
    const opp=pos.side?0:1;
    const oppTeams=teamKnown(pos.m,opp)?(teamIsBye(pos.m,opp)?[]:[{p:opp?pos.m.b:pos.m.a,seed:opp?pos.m.sb:pos.m.sa}]):(c>0?aliveTeams(d,c-1,2*r+opp):[]);
    steps.push({c, rd:d.rounds[c]||pos.m.rd, m:pos.m, teams:oppTeams, bye:teamKnown(pos.m,opp)&&teamIsBye(pos.m,opp), now:true});
  }
  let pc=c, pr=r;
  while(pc+1<d.cols){
    const nc=pc+1, nr=Math.floor(pr/2); const nm=drawMatch(d,nc,nr); if(!nm) break;
    const sib=(pr%2===0)?1:0; // the other child of the next match
    const teams=aliveTeams(d,pc,2*nr+sib);
    steps.push({c:nc, rd:d.rounds[nc]||nm.rd, m:nm, teams});
    pc=nc; pr=nr;
  }
  return {pos, steps, out:false};
}
function teamLabel(t, withFlag){
  const names=t.p.map(p=>p.n.split(' ').pop()).join('/');
  const cc=t.p[0]?t.p[0].c:'';
  return (withFlag!==false?'<span class="flag" style="width:auto;font-size:14px">'+flag(cc)+'</span> ':'')+esc(names)+(t.seed?' <span class="seed">['+esc(t.seed)+']</span>':'');
}
function toCard(dm, ev){ // draw match -> card shape, preferring the live day-match record when it exists
  const live=dm.n&&D.byCode.get(dm.n); if(live) return live;
  return {i:'d'+dm.n, n:dm.n, d:dm.t.slice(0,10), t:dm.t, tm:dm.t.slice(11,16)||'', ev, rd:dm.rd, court:0, v:'', loc:'', st:dm.st, stv:'', ss:dm.ss, du:null, w:dm.w, sc:dm.sc, a:dm.a, b:dm.b, sa:dm.sa, sb:dm.sb, bye:dm.ab||dm.bb, tbd:!(dm.a.length||dm.ab)||!(dm.b.length||dm.bb)};
}
function roadSection(p, ev, ctx){
  const dr=drawFor(ev);
  if(!D.drawList) return '<div class="card road"><div class="rhead"><b>'+esc(ev)+'</b> <span class="muted small">loading draw list…</span></div></div>';
  if(!dr) return '';
  const d=D.draws[dr.id];
  if(!d){ return '<div class="card road" data-draw="'+dr.id+'"><div class="rhead"><b>'+esc(ev)+' draw</b> <span class="muted small">loading…</span></div><div class="skel" style="height:40px;margin-top:8px"></div></div>'; }
  const road=roadAhead(d,p.i);
  let html='<div class="card road"><div class="rhead row"><b class="grow">'+esc(ev)+' · road ahead</b><button class="btn ghost" data-act="draw" data-id="'+dr.id+'" data-pid="'+p.i+'">Full draw ›</button></div>';
  if(!road){ html+='<div class="muted small">Not found in this draw.</div></div>'; return html; }
  if(road.out){ const m=road.pos.m; const opp=road.pos.side?m.a:m.b; html+='<div class="small">Out in '+esc(m.rd)+(opp.length?' · lost to '+esc(opp.map(x=>x.n.split(' ').pop()).join('/')):'')+(m.sc.length?' · '+m.sc.map(x=>road.pos.side?x[1]+'-'+x[0]:x[0]+'-'+x[1]).join(' '):'')+'.</div></div>'; return html; }
  html+='<ol class="road-steps">';
  for(const st of road.steps){
    const dayM=st.m.n&&D.byCode.get(st.m.n);
    const when=dayM?( (dayM.d===ctx.td?'Today':dayLabel(dayM.d))+' '+dayM.tm+(dayM.v?' · <span class="vchip v-'+dayM.v+'"><span class="lt">'+dayM.v+'</span>'+(dayM.court?'<span>C'+dayM.court+'</span>':'')+'</span>':'') ):(st.m.t?dayLabel(st.m.t.slice(0,10))+' '+st.m.t.slice(11,16):'not scheduled yet');
    let who;
    if(st.bye) who='<span class="muted">Bye, straight through</span>';
    else if(!st.teams.length) who='<span class="muted">to be decided</span>';
    else if(st.teams.length===1) who=teamLabel(st.teams[0]);
    else { const shown=st.teams.slice(0,6); who='<span class="muted">one of '+st.teams.length+':</span> '+shown.map(t=>teamLabel(t)).join('<span class="sep"> · </span>')+(st.teams.length>6?' <span class="muted">+'+(st.teams.length-6)+' more</span>':''); }
    html+='<li'+(st.now?' class="now"':'')+'><div class="rd">'+esc(st.rd)+'</div><div class="grow"><div class="who">'+who+'</div><div class="tiny muted">'+when+'</div></div></li>';
  }
  html+='</ol></div>';
  return html;
}
function ensureDrawList(){ // loads the draw list once, re-renders when it lands
  if(D.drawList||D.drawListBusy) return;
  D.drawListBusy=loadDrawList().then(()=>{ D.drawListBusy=null; render({bg:true}); }).catch(()=>{ D.drawListBusy=null; });
}
function ensureDraws(evs){ // kick off loads for stale or missing draws; re-render when they land
  if(!D.drawList){ ensureDrawList(); return; }
  for(const e of evs){
    const dr=drawFor(e); if(!dr) continue;
    const cur=D.draws[dr.id]; if(cur&&Date.now()-cur.at<10*60000) continue;
    if(D.drawBusy[dr.id]) continue;
    loadDraw(dr.id).then(()=>render({bg:true})).catch(()=>{});
  }
}
function viewDraw(ctx){
  ensureDrawList();
  const dr=(D.drawList||[]).find(x=>x.id===S.draw.id); const d=D.draws[S.draw.id];
  let html='<div class="row" style="margin-bottom:8px"><button class="btn ghost" data-act="drawback">‹ Back</button><h2 class="grow" style="margin:0">'+esc(dr?dr.name:'Draw')+'</h2>'+(d?'<span class="tiny muted">draw of '+(dr&&dr.size?dr.size:(1<<d.cols))+'</span>':'')+'</div>';
  if(!d){
    if(S.drawErr) html+='<div class="banner err">Could not load the draw ('+esc(S.drawErr)+'). <button class="btn ghost" data-act="drawretry">Retry</button></div>';
    else { html+='<div class="stack"><div class="skel"></div><div class="skel"></div></div>'; if(!D.drawBusy[S.draw.id]) loadDraw(S.draw.id).then(()=>render({bg:true})).catch(e=>{ S.drawErr=String(e&&e.message||e); render({bg:true}); }); }
    return html;
  }
  const pid=S.draw.pid; const pos=pid?playerPosition(d,pid):null;
  const cols=[]; for(let c=0;c<d.cols;c++){ const ms=d.m.filter(m=>m.c===c); const real=ms.filter(m=>!(m.ab||m.bb)).length; cols.push({c, rd:d.rounds[c]||('R'+(1<<(d.cols-c))), n:ms.length, real}); }
  if(S.draw.col==null){ S.draw.col=pos?Math.min(pos.m.c+(pos.won?1:0),d.cols-1):(cols.find(x=>d.m.some(m=>m.c===x.c&&m.st!=='F'&&!(m.ab||m.bb)))||cols[0]).c; }
  html+='<div class="chips">'+cols.map(x=>'<button class="chip rd'+(S.draw.col===x.c?' on':'')+'" data-act="drawcol" data-c="'+x.c+'">'+esc(x.rd)+'<span class="n">'+x.real+'</span></button>').join('')+'</div>';
  const ms=d.m.filter(m=>m.c===S.draw.col);
  const hl=pid?new Set([pid]):null;
  if(pos&&pid){ const road=roadAhead(d,pid); if(road&&!road.out){ const step=road.steps.find(x=>x.c===S.draw.col); if(step&&!step.now&&step.teams.length){ html+='<div class="next small"><b>Possible opponent'+(step.teams.length>1?'s':'')+' in '+esc(step.rd)+':</b> '+step.teams.slice(0,10).map(t=>teamLabel(t)).join('<span class="sep"> · </span>')+(step.teams.length>10?' +'+(step.teams.length-10)+' more':'')+'</div>'; } } }
  html+='<div class="stack" style="margin-top:8px">';
  const byes=ms.filter(m=>m.ab||m.bb);
  const half=Math.ceil(ms.length/2); let bottomShown=false;
  if(ms.length>=4) html+='<div class="ev" style="margin:6px 0 -4px">Top half</div>';
  for(const m of ms){
    if(m.ab||m.bb){ continue; }
    if(!bottomShown&&ms.length>=4&&m.r>=half){ html+='<div class="ev" style="margin:6px 0 -4px">Bottom half</div>'; bottomShown=true; }
    const card=toCard(m, dr?dr.name:'');
    if(card.tbd){ html+=tbdCard(m,d); continue; }
    html+=matchCard(card,ctx,{hl, markMine:true, showDate:true});
  }
  if(byes.length){ html+='<details class="byes"><summary class="small muted">'+byes.length+' bye'+(byes.length===1?'':'s')+' in this round</summary><div class="small" style="padding:6px 2px">'+byes.map(m=>{ const t=m.ab?m.b:m.a; return t.length?'<div>'+esc(t.map(p=>p.n).join(' / '))+(m.ab?(m.sb?' ['+esc(m.sb)+']':''):(m.sa?' ['+esc(m.sa)+']':''))+'</div>':''; }).join('')+'</div></details>'; }
  html+='</div>';
  return html;
}
function tbdCard(m,d){ // a match whose players are not decided yet: show who can still get there
  const sides=[0,1].map(side=>{ if(teamKnown(m,side)){ const t=side?m.b:m.a; return t.length?[{p:t,seed:side?m.sb:m.sa}]:[]; } return m.c>0?aliveTeams(d,m.c-1,2*m.r+side):[]; });
  const pid=S.draw&&S.draw.pid;
  const lab=ts=>ts.length?ts.slice(0,4).map(t=>(pid&&t.p.some(x=>x.i===pid))?'<span class="me">'+teamLabel(t)+'</span>':teamLabel(t)).join('<span class="sep"> · </span>')+(ts.length>4?' <span class="muted">+'+(ts.length-4)+'</span>':''):'<span class="muted">tbd</span>';
  return '<article class="match tbd"><div class="when"><span class="t num">'+(m.t?esc(m.t.slice(11,16)):'—')+'</span>'+(m.t?'<span class="tiny muted">'+esc(dayLabel(m.t.slice(0,10)))+'</span>':'')+'</div><div class="grow"><div class="mhead"><span class="ev">'+esc(m.rd)+' · match '+esc(m.n)+'</span><span class="pill sched">Not decided</span></div><div class="small" style="padding:3px 0">'+lab(sides[0])+'</div><div class="tiny muted" style="padding-left:2px">v</div><div class="small" style="padding:3px 0">'+lab(sides[1])+'</div></div></article>';
}

/* ---------- hash / sharing ---------- */
function updHash(){
  let h='';
  if(S.draw) h='#d='+S.draw.id+(S.draw.pid?'-'+S.draw.pid:'');
  else if(S.tab==='players'&&S.player) h='#p='+S.player.i;
  else if(S.tab==='countries'&&S.country) h='#c='+S.country;
  else if(S.tab==='venues') h='#venues';
  else if(S.tab==='players') h='#players';
  else h='';
  try{ if(location.hash!==h) history.replaceState(null,'',location.pathname+location.search+h); }catch(e){}
}
function readHash(){
  const h=(location.hash||'').slice(1);
  if(!h) return;
  const m=/^p=(\d+)$/.exec(h); if(m){ S.tab='players'; S.pendingPlayer=m[1]; return; }
  const dm=/^d=(\d+)(?:-(\d+))?$/.exec(h); if(dm){ S.draw={id:dm[1], pid:dm[2]||null, col:null}; return; }
  const c=/^c=([A-Z]{3})$/.exec(h); if(c){ S.tab='countries'; S.country=c[1]; return; }
  if(h==='venues') S.tab='venues'; else if(h==='players') S.tab='players'; else if(h==='me') S.tab='me';
}
function shareUrl(id){ const base=(window.SHARE_BASE||(location.origin+location.pathname)); return base+'#p='+id; }
async function share(id,name){
  const url=shareUrl(id); const text='Matches for '+name+' at the European Senior Championships 2026';
  try{ if(navigator.share){ await navigator.share({title:text,text:text,url:url}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(url); toast('Link copied'); }catch(e){ prompt('Copy this link', url); }
}
let toastT=null;
function toast(msg){ let t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),1800); }

/* ---------- events ---------- */
document.querySelector('.tabbar').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  if(S.tab===b.dataset.tab&&S.tab==='players'){ S.player=null; }
  S.tab=b.dataset.tab; store.set('tab',S.tab); S.q=''; S.draw=null; render();
});
document.getElementById('refresh').addEventListener('click',()=>load({force:true}));
document.getElementById('view').addEventListener('input',e=>{
  if(e.target.tagName!=='INPUT') return;
  S.q=e.target.value; const id=e.target.id;
  // re-render results only, keep the input
  const box=e.target.closest('.search'); const res=document.getElementById(e.target.dataset.res);
  if(res){ res.innerHTML=searchResults(S.q,{act:e.target.dataset.ract||'open'}); }
  const clr=box.querySelector('.clr'); if(S.q&&!clr){ const b=document.createElement('button'); b.className='clr'; b.dataset.act='clear'; b.dataset.for=id; b.setAttribute('aria-label','Clear'); b.textContent='×'; box.appendChild(b);} else if(!S.q&&clr) clr.remove();
});
document.getElementById('view').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  const pick=()=>{ const p=D.players.get(id); return p?{i:p.i,n:p.n,c:p.c}:null; };
  if(act==='setme'){ const p=pick(); if(p){ S.me=p; store.set('me',p); S.q=''; S.tab='me'; store.set('tab','me'); toast('Saved as you'); render(); } }
  else if(act==='notme'){ S.me=null; store.del('me'); S.q=''; S.focusSearch='q-me'; render(); }
  else if(act==='open'){ const p=pick(); if(p){ S.player=p; S.tab='players'; store.set('tab','players'); render(); } }
  else if(act==='back'){ S.player=null; S.focusSearch='q-players'; render(); }
  else if(act==='follow'){ const p=pick(); if(!p) return; if(isFollowed(p.i)) S.follow=S.follow.filter(x=>x.i!==p.i); else S.follow.push(p); store.set('follow',S.follow); render({keepScroll:true}); }
  else if(act==='share'){ share(id,b.dataset.name||''); }
  else if(act==='draw'){ S.draw={id:b.dataset.id, pid:b.dataset.pid||null, col:null}; S.drawErr=null; render(); }
  else if(act==='drawback'){ S.draw=null; render(); }
  else if(act==='drawcol'){ if(S.draw){ S.draw.col=+b.dataset.c; render(); } }
  else if(act==='drawretry'){ if(S.draw){ S.drawErr=null; loadDraw(S.draw.id,true).then(()=>render({bg:true})).catch(e=>{ S.drawErr=String(e&&e.message||e); render({bg:true}); }); render(); } }
  else if(act==='country'){ S.country=b.dataset.cc||null; store.set('country',S.country); render(); }
  else if(act==='cday'){ S.cday=b.dataset.d; S.cfilter='all'; render(); }
  else if(act==='cfilter'){ S.cfilter=b.dataset.f; render(); }
  else if(act==='clear'){ S.q=''; S.focusSearch=b.dataset.for; render(); }
  else if(act==='retry'){ load({force:true}); }
});
window.addEventListener('scroll',()=>{ S.lastScroll=Date.now(); },{passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(Date.now()-D.lastOk>30000) load(); else render({bg:true}); } });
setInterval(()=>{ if(document.visibilityState==='visible'){ if(Date.now()-(D.lastOk||0)>CFG.refreshMs) load(); else if(S.dirty===false) { /* keep clocks fresh */ render({bg:true}); } } }, 30000);
window.addEventListener('hashchange',()=>{ readHash(); resolvePending(); render(); });
function resolvePending(){ if(S.pendingPlayer){ const p=D.players.get(S.pendingPlayer); if(p){ S.player={i:p.i,n:p.n,c:p.c}; S.pendingPlayer=null; } } }

/* ---------- boot ---------- */
readHash();
bootFromCache();
resolvePending();
render();
load().then(()=>{ resolvePending(); render({bg:true}); });
})();
</script>
